name: Gbatteries
description: GBatteries (GBatteries Energy Canada Inc.) is an Ottawa, Ontario battery technology
  company developing lithium-metal battery cells and an intelligent, adaptive battery management
  system for the next generation of electric mobility, from land to air. Its technology targets
  fast charging (sub-15-minute charge), high energy density (450+ Wh/kg), extended cycle life,
  and enhanced safety by actively reducing irreversible internal cell damage. The company reports
  60+ granted or pending patents and 9+ years of R&D, and was surfaced as a Y Combinator portfolio
  company. GBatteries is a hardware and battery-management deeptech firm; it publishes no public
  developer API, SDK, or developer portal.
